<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seja voluntário — Lar dos Pets</title>
    <link rel="shortcut icon" href="../../logo/logo_lardospets.ico" type="image/x-icon">
    <link rel="stylesheet" href="../../css/voluntarios.css">
</head>
<body>
    <section id="area-formulario-voluntario" class="formulario-voluntario">
  <h1>Quero ser voluntário</h1>

  <form id="formulario-voluntario">
    <label for="nome">Nome completo</label>
    <input type="text" id="nome" name="nome" required>

    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" required>

    <label for="telefone">Telefone</label>
    <input type="tel" id="telefone" name="telefone" required>

    <label for="cidade">Cidade</label>
    <input type="text" id="cidade" name="cidade" required>

    <label for="disponibilidade">Disponibilidade</label>
    <select id="disponibilidade" name="disponibilidade" required>
      <option value="">Selecione</option>
      <option value="Durante a semana">Durante a semana</option>
      <option value="Finais de semana">Finais de semana</option>
      <option value="Ambos">Ambos</option>
    </select>

    <label for="mensagem">Como deseja ajudar?</label>
    <textarea id="mensagem" name="mensagem" required></textarea>
    <button type="submit">Enviar cadastro</button>
    <a href="../../index.html">Voltar</a>
  </form>
  <p id="mensagem-retorno"></p>
</section>

<script src="../../js/voluntarios.js"></script>

</body>
</html>
